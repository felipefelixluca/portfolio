name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; cancel queued runs in favour of the latest
concurrency:
  group: pages
  cancel-in-progress: true

# Opt into Node.js 24 for every JavaScript action in this workflow.
# GitHub starts forcing Node 24 by default on 2026-06-02 and removes Node 20
# from the runner on 2026-09-16. Some Pages actions (configure-pages,
# upload-pages-artifact, deploy-pages) haven't shipped a Node-24-native major
# yet — this env var lets them run on Node 24 today using the existing
# versions. Safe to remove once all of them publish Node 24 majors.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The site URL Astro should bake into <link rel="canonical"> etc.
      # Falls back to https://<owner>.github.io if not set as a repo variable.
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      # Subpath the site is served from.
      # - User/org-pages repo (e.g. felipefelixluca.github.io) → leave as "/"
      # - Project-pages repo (e.g. portfolio)                  → set BASE_PATH variable to "/portfolio"
      BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro + StatiCrypt encrypt)
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
